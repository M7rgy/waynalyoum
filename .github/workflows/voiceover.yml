# Upload your voice-over to the voice/ folder named after the reel ID, e.g. voice/D14-06.m4a (GitHub web: Add file > Upload files)
# and this rebuilds that day's reel with your voice before it is published.
name: Rebuild reel with voice-over
on:
  push:
    paths:
      - "voice/**"
      - "!voice/README.md"
      - "assets/*/voice/**"
  workflow_dispatch:
    inputs:
      date:
        description: "Date (YYYY-MM-DD), default today"
        required: false
permissions:
  contents: write
concurrency:
  group: agency
  cancel-in-progress: false
jobs:
  rebuild:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agency/requirements.txt
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq libfribidi0 libraqm0 ffmpeg fonts-noto-color-emoji
      - run: pip install -r agency/requirements.txt
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: reel/package-lock.json
      - name: Install reel renderer
        run: cd reel && npm ci --no-audit --no-fund && npx remotion browser ensure
      - name: Rebuild slides + reel, re-upload media
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          D="${{ github.event.inputs.date }}"; [ -n "$D" ] || D=$(TZ=Asia/Bahrain date +%F)
          (cd agency && python render_slides.py "$D" && python make_reel.py "$D")
          bash scripts/push_media.sh "$D"
          git config user.name "waynalyoum-bot"; git config user.email "actions@users.noreply.github.com"
          git add -A content && git commit -qm "Reel rebuilt with voice-over $D" || exit 0
          git pull --rebase -q && git push -q
