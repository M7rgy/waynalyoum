# One-click test: confirms the Instagram + Claude keys work. Posts nothing.
name: Check connections
on:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -q anthropic
      - name: Instagram
        working-directory: agency
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: python publish_ig.py --check
      - name: Claude
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_WORKSPACE_ID: ${{ secrets.ANTHROPIC_WORKSPACE_ID }}
        run: |
          python - <<'PY'
          import os, anthropic
          ws = os.environ.get("ANTHROPIC_WORKSPACE_ID") or None
          c = anthropic.Anthropic(default_headers={"anthropic-workspace-id": ws} if ws else None)
          m = c.messages.create(model="claude-haiku-5-5", max_tokens=20, messages=[{"role": "user", "content": "Reply with: OK"}])
          print("Claude:", "".join(b.text for b in m.content if b.type == "text"))
          PY
