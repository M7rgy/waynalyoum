# Builds the day's 8 posts at 06:00 Bahrain (03:00 UTC): research -> safety -> writing -> slides -> reel -> summary issue
name: Daily batch
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Rebuild even if today's batch already exists"
        type: boolean
        default: false
permissions:
  contents: write
  issues: write
concurrency:
  group: agency
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Already built today?
        id: guard
        run: |
          T=$(TZ=Asia/Bahrain date +%F)
          if [ -f "content/$T/batch.json" ] && [ "${{ github.event.inputs.force }}" != "true" ]; then
            echo "Batch for $T already exists -> skipping (use Run workflow with force to rebuild)"; echo "skip=true" >> $GITHUB_OUTPUT
          fi
      - uses: actions/setup-python@v6
        if: steps.guard.outputs.skip != 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agency/requirements.txt
      - name: System packages (Arabic text shaping + video)
        if: steps.guard.outputs.skip != 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libfribidi0 libraqm0 ffmpeg fonts-noto-color-emoji
      - run: pip install -r agency/requirements.txt
        if: steps.guard.outputs.skip != 'true'
      - uses: actions/setup-node@v5
        if: steps.guard.outputs.skip != 'true'
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: reel/package-lock.json
      - name: Install reel renderer
        if: steps.guard.outputs.skip != 'true'
        run: cd reel && npm ci --no-audit --no-fund && npx remotion browser ensure
      - name: Build batch
        if: steps.guard.outputs.skip != 'true'
        working-directory: agency
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_WORKSPACE_ID: ${{ secrets.ANTHROPIC_WORKSPACE_ID }}
        run: |
          echo "TODAY=$(TZ=Asia/Bahrain date +%F)" >> $GITHUB_ENV
          python run_daily.py --today
      - name: Slides, stories and reel
        if: steps.guard.outputs.skip != 'true'
        working-directory: agency
        run: |
          python render_slides.py "$TODAY"
          python make_reel.py "$TODAY"
      - name: Upload media (orphan "media" branch -> jsDelivr)
        if: steps.guard.outputs.skip != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/push_media.sh "$TODAY"
      - name: Save to repo
        if: steps.guard.outputs.skip != 'true'
        run: |
          git config user.name "waynalyoum-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A content data assets
          git commit -m "Batch $TODAY" || echo "nothing to commit"
          git pull --rebase -q && git push -q
      - name: Daily summary issue (phone notification)
        if: steps.guard.outputs.skip != 'true'
        working-directory: agency
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python daily_summary.py "$TODAY"
          cd .. && git add -A content && git commit -qm "Summary $TODAY" && git pull --rebase -q && git push -q || true
